<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Генератор карточек товаров</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c1e21; --muted:#6b7280; --line:#d9dce1; --accent:#2563eb; --err:#b91c1c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --card:#1d2026; --text:#e6e8eb; --muted:#9aa1ac; --line:#333842; --accent:#60a5fa; --err:#f87171; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:860px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:1.4rem; margin:0 0 16px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:16px; }
  h2 { font-size:1rem; margin:0 0 8px; }
  textarea { width:100%; min-height:160px; padding:8px; font:14px/1.4 ui-monospace, monospace; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:6px; }
  textarea.short { min-height:80px; }
  pre { margin:0 0 8px; padding:8px; max-height:420px; overflow:auto; white-space:pre-wrap; word-break:break-word; font:13px/1.4 ui-monospace, monospace; background:var(--bg); border:1px solid var(--line); border-radius:6px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0; align-items:center; }
  button { padding:8px 14px; font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:6px; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  .muted { color:var(--muted); font-size:.9rem; }
  .error { color:var(--err); }
  .field { margin:12px 0; }
  .field label { display:block; font-weight:600; margin-bottom:4px; }
  .field input { width:100%; padding:8px; font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:6px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>Генератор карточек товаров</h1>

  <section>
    <h2>Данные о товаре (JSON)</h2>
    <div class="row">
      <input type="file" id="file" accept=".json,application/json">
      <button id="paste" type="button">Вставить из буфера</button>
    </div>
    <textarea id="raw" placeholder='{"name": "…", "manufacturer": "…", "specs": {"…": "…"}, "description": "…", "url": "…"}'></textarea>
    <div class="row">
      <button id="go" class="primary" type="button">Сформировать</button>
      <span id="status" class="muted"></span>
    </div>
    <div id="error" class="error" role="alert"></div>
  </section>

  <section id="missing" hidden>
    <h2>Не хватает данных</h2>
    <p id="product-class" class="muted"></p>
    <p class="muted">Заполните поля или сформируйте карточку как есть: отсутствующее будет помечено «данных нет».</p>
    <div id="missing-fields"></div>
    <div class="row">
      <button id="apply" class="primary" type="button">Применить и сформировать</button>
      <button id="force" type="button">Сформировать как есть</button>
    </div>
  </section>

  <section id="result" hidden>
    <h2>Карточка товара (JSON)</h2>
    <pre id="json"></pre>
    <div class="row">
      <button id="copy" type="button">Копировать JSON</button>
      <button id="download" type="button">Скачать JSON</button>
      <span id="copied" class="muted"></span>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let extra = {};
let lastProduct = null;
let lastCard = null;

function setBusy(busy, text = "") {
  for (const id of ["go", "apply", "force"]) $(id).disabled = busy;
  $("status").textContent = text;
}

function showError(message) { $("error").textContent = message || ""; }

$("file").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  $("raw").value = await file.text();
  extra = {};
  showError("");
});

$("paste").addEventListener("click", async () => {
  try {
    $("raw").value = await navigator.clipboard.readText();
    extra = {};
  } catch {
    showError("Браузер не дал доступ к буферу обмена. Вставьте текст вручную (Ctrl+V).");
  }
});

async function api(path, body) {
  const response = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) {
    const detail = typeof data.detail === "string" ? data.detail : "Ошибка запроса (" + response.status + ")";
    throw new Error(detail);
  }
  return data;
}

async function generate(force = false) {
  showError("");
  const raw = $("raw").value.trim();
  if (!raw) { showError("Вставьте JSON или выберите файл."); return; }
  setBusy(true, "Генерируем…");
  try {
    const data = await api("/api/generate", { raw, extra: Object.keys(extra).length ? extra : null, force });
    lastProduct = data.product;
    if (data.status === "needs_more_data") renderMissing(data);
    else renderResult(data);
  } catch (err) {
    showError(err.message);
  } finally {
    setBusy(false);
  }
}

function renderMissing(data) {
  $("result").hidden = true;
  const box = $("missing-fields");
  box.replaceChildren();
  $("product-class").textContent = data.product_class ? "Определён тип товара: " + data.product_class : "";
  for (const [index, field] of data.missing_fields.entries()) {
    const wrap = document.createElement("div");
    wrap.className = "field";
    const label = document.createElement("label");
    label.textContent = field.label;
    label.htmlFor = "extra-" + index;
    let input;
    if (field.key === "specs" || field.key === "description") {
      input = document.createElement("textarea");
      input.className = "short";
      if (field.key === "specs") input.placeholder = "По одной характеристике в строке: Название: значение";
    } else {
      input = document.createElement("input");
    }
    input.id = "extra-" + index;
    input.dataset.key = field.key;
    wrap.append(label, input);
    box.append(wrap);
  }
  $("missing").hidden = false;
}

function collectExtra() {
  const result = {};
  for (const input of $("missing-fields").querySelectorAll("[data-key]")) {
    const value = input.value.trim();
    if (!value) continue;
    if (input.dataset.key === "specs") {
      result.specs = {};
      for (const line of value.split("\n")) {
        const i = line.indexOf(":");
        if (i > 0 && line.slice(i + 1).trim()) result.specs[line.slice(0, i).trim()] = line.slice(i + 1).trim();
      }
    } else if (input.dataset.key.startsWith("specs.")) {
      result.specs = { ...(result.specs || {}), [input.dataset.key.slice(6)]: value };
    } else {
      result[input.dataset.key] = value;
    }
  }
  return result;
}

$("apply").addEventListener("click", () => { extra = { ...extra, ...collectExtra() }; generate(false); });
$("force").addEventListener("click", () => { extra = { ...extra, ...collectExtra() }; generate(true); });

function renderResult(data) {
  $("missing").hidden = true;
  lastCard = data.card;
  $("json").textContent = JSON.stringify(lastCard, null, 2);
  $("copied").textContent = "";
  $("result").hidden = false;
}

$("copy").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(JSON.stringify(lastCard, null, 2));
    $("copied").textContent = "Скопировано";
  } catch {
    $("copied").textContent = "Не удалось скопировать";
  }
});

$("download").addEventListener("click", () => {
  const name = (lastProduct && lastProduct.name ? lastProduct.name : "product")
    .replace(/[^\p{L}\p{N}]+/gu, "_")
    .replace(/^_+|_+$/g, "");
  const blob = new Blob([JSON.stringify(lastCard, null, 2)], { type: "application/json" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "card_" + name + ".json";
  link.click();
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
});

$("go").addEventListener("click", () => { extra = {}; generate(false); });
</script>
</body>
</html>
